name: CI-CD VV&T

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_vvt
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: db_vvt

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar cliente MySQL e dependências Python
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar arquivos do projeto
        run: |
          pwd
          ls -la
          test -f schema.sql
          test -f requirements.txt
          test -f app.py
          test -f test_gerador_codigo.py
          test -f test_integracao_mysql.py

      - name: Verificar cliente MySQL instalado
        run: mysql --version

      - name: Aguardar MySQL ficar disponível
        run: |
          for i in {1..30}; do
            if mysqladmin ping --protocol=tcp -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; then
              exit 0
            fi
            echo "Aguardando MySQL... tentativa $i/30"
            sleep 2
          done
          echo "MySQL não ficou disponível a tempo."
          exit 1

      - name: Validar acesso ao servidor MySQL
        run: |
          mysql --protocol=tcp -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "SHOW DATABASES;"

      - name: Aplicar schema
        run: |
          mysql --protocol=tcp -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" < schema.sql

      - name: Validar estrutura criada
        run: |
          mysql --protocol=tcp -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "
            USE $MYSQL_DATABASE;
            SHOW TABLES;
            DESCRIBE codigos_sequenciais;
            SELECT COUNT(*) AS total_registros_iniciais FROM codigos_sequenciais;
          "

      - name: Executar testes automatizados com pytest
        run: python -m pytest -q

      - name: Executar inserção real e query de verificação
        run: |
          python app.py
          mysql --protocol=tcp -h"$MYSQL_HOST" -P"$MYSQL_PORT" -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "
            USE $MYSQL_DATABASE;
            SELECT id, codigo, sec, Grupo, Tipo_Alimento, Pais
            FROM codigos_sequenciais
            ORDER BY id DESC
            LIMIT 10;
          "
